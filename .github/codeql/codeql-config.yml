name: BookIndex CodeQL config

# CodeQL must analyse only hand-written JavaScript source (src/, scripts/, tests/,
# top-level configs). Everything below is a committed BUILD ARTIFACT, not source:
# scripts/prerender.mjs (run by `npm run build`) emits ~700 prerendered index.html pages,
# and EACH inlines the full ~652 KiB runtime plus JSON-LD and a redirect script.
# Extracting JS from all of them blows past the 10-minute job cap, so every run on main
# was cancelled ("The operation was canceled"). Their JS is a copy of src/runtime/, which
# is analysed on its own, so excluding them loses no coverage.
paths-ignore:
  # v3_app.js became build output again in H4013 (src/runtime/ -> v3_app.js). While it was
  # hand-maintained it WAS the source and had to be scanned; now it is a second copy of
  # src/runtime/, so scanning it only reports every finding twice — once at its real
  # location in src/runtime/ and once here — and pays the extraction cost again.
  - v3_app.js
  - aaz-index.html
  # Prerendered category pages: <cat>/list/index.html and <cat>/list/item/**/index.html
  # (all, names, toponyms, ethnonyms, languages, lexicon, lexicon_reverse, lexicon_tech,
  # subject). Whole dirs are generated HTML — no JS source lives under them. If a new
  # top-level category is ever added, add its dir here too.
  - all/**
  - names/**
  - toponyms/**
  - ethnonyms/**
  - languages/**
  - lexicon/**
  - lexicon_reverse/**
  - lexicon_tech/**
  - subject/**
  # Prerendered materials (lecture_pages/**, lectures, sources, tasks) and scholar/viz.
  - materials/**
  - scholar/**
  # Vendored minified libraries (root + public copy) and the runtime build copy
  # (duplicate of v3_app.js + vendor).
  - vendor/**
  - public/vendor/**
  - dist-runtime/**
