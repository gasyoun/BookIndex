name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm run check:security

      - name: Build standalone artifact
        run: npm run build

      - name: Static security policy guard
        run: npm run check:security:static

      - name: TypeScript / JS typecheck
        run: npm run typecheck

      - name: JS syntax checks
        run: npm run check:js

      # v3_app.js is build output again (H4013), so this asserts the strong property:
      # the committed artifact is byte-identical to what src/runtime/ builds. Without it a
      # hand-edit to the generated file reads as green — which is how four shipped features
      # became un-rebuildable between H1821 and H3874 (FINDINGS.md §3).
      - name: Runtime source parity
        run: npm run check:parity:runtime

      # Belt to the parity gate's braces: prove the committed artifact survives the
      # documented regeneration path, the same way aaz-index.html is checked below.
      - name: Ensure committed v3_app.js is in sync
        run: |
          npm run build:runtime
          git diff --exit-code -- v3_app.js

      - name: UI inline style guard
        run: npm run check:ui

      - name: Performance budget
        run: npm run check:perf

      - name: Encoding / mojibake check
        run: python scripts/check_encoding.py --strict

      - name: Encoding / mojibake check (docs)
        run: python scripts/check_encoding.py --strict README.md CLAUDE.md CHANGELOG.md CONTRIBUTING.md KIDS_GUIDE_RU.md docs/*.md

      - name: Python unit tests
        run: python -m unittest discover -s tests/unit -t .

      - name: Validate content data
        run: python scripts/validate_content.py app_data.json

      - name: Ensure manual audit queue is in sync
        run: |
          python scripts/content_report.py app_data.json --write-quality-queue tests/index-audit-queue.json
          git diff --exit-code -- tests/index-audit-queue.json

      - name: Ensure split modules are in sync
        run: |
          python scripts/split_app_data.py app_data.json --out-dir data/modules
          git diff --exit-code -- data/modules
          python scripts/assemble_app_data.py --modules-dir data/modules --out app_data.json
          git diff --exit-code -- app_data.json

      - name: Runtime smoke test (21/21)
        run: python runtime_test.py

      # "Build standalone artifact" above regenerates aaz-index.html AND every
      # prerendered item page (all/ ethnonyms/ languages/ lexicon/
      # lexicon_reverse/ lexicon_tech/ materials/ names/ scholar/ subject/
      # toponyms/ - each inlines the runtime, CSP script hashes and the module
      # manifest). 04-09-2026: 699 pages drifted for two days (stale runtime
      # pre-H4025, stale manifests post-H4051-B10) with only aaz-index.html
      # gated - deep links served the old bundle and stale CSP hashes. Diff the
      # whole build output, not just the entry page.
      - name: Ensure committed build output (aaz-index + prerendered pages) is in sync
        run: git diff --exit-code -- aaz-index.html all ethnonyms languages lexicon lexicon_reverse lexicon_tech materials names scholar subject toponyms

      # H4051: the print pipeline had no CI at all - eleven revisions of MG
      # feedback landed in print/ with "frozen sheets are byte-identical"
      # enforced by a human reading `git status`. Same regenerate-and-diff
      # pattern the five gates above use. The generator's own hardFail gate
      # (overlaps / escapes / legend parity / non-finite coordinates) runs
      # inside it, so this asserts both determinism and the gates.
      - name: Ensure committed toponym print sheets are in sync
        run: npm run print:toponyms:check

      - name: Vite build smoke
        run: |
          npm run build:vite
          npm run build
          git diff --exit-code -- aaz-index.html all ethnonyms languages lexicon lexicon_reverse lexicon_tech materials names scholar subject toponyms

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E full suite (Playwright)
        run: npm run check:e2e
