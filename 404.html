<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена | BookIndex</title>
  <style>
    body {
      font-family: 'Noto Serif', 'DejaVu Serif', Georgia, 'PT Serif', 'Times New Roman', serif;
      background: #faf8f3;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 600px;
      border: 2px solid #8a7050;
      padding: 40px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(90, 56, 24, 0.06);
    }
    h1 {
      color: #5a3818;
      font-size: 3.5rem;
      margin: 0 0 10px 0;
    }
    h2 {
      color: #8a7050;
      font-weight: normal;
      margin: 0 0 20px 0;
    }
    p {
      line-height: 1.6;
      color: #665f57;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      padding: 10px 24px;
      background: #5a3818;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #8a7050;
    }
  </style>
  <script>
    (function() {
      const pathname = window.location.pathname;
      let cleanPath = pathname;
      if (cleanPath.startsWith('/BookIndex/')) {
        cleanPath = cleanPath.substring('/BookIndex/'.length);
      } else if (cleanPath.startsWith('/')) {
        cleanPath = cleanPath.substring(1);
      }

      cleanPath = cleanPath.replace(/index\.html$/, '').replace(/\/+$/, '');
      const repoPrefix = window.location.pathname.startsWith('/BookIndex/') ? '/BookIndex/' : '/';

      // A2: retired-slug redirects. Slugs are frozen by canonical_id, so this is
      // normally empty; when a slug is retired, send old citations to the new URL.
      const itemMatch = cleanPath.match(/^([a-z_]+)\/list\/item\/[a-z_]+\/([^\/]+)$/);
      if (itemMatch) {
        fetch(repoPrefix + 'data/slug_redirects.json').then(r => r.ok ? r.json() : null).then(data => {
          const to = data && data.redirects && data.redirects[itemMatch[1]] && data.redirects[itemMatch[1]][itemMatch[2]];
          if (to && /^[a-z0-9-]+$/.test(to)) {
            window.location.replace(window.location.origin + repoPrefix + itemMatch[1] + '/list/item/' + itemMatch[1] + '/' + to + '/');
          } else {
            spaFallback();
          }
        }).catch(spaFallback);
        return;
      }
      spaFallback();

      function spaFallback() {
      if (cleanPath && (
        cleanPath.startsWith('materials') || 
        cleanPath.startsWith('names') || 
        cleanPath.startsWith('toponyms') || 
        cleanPath.startsWith('ethnonyms') || 
        cleanPath.startsWith('languages') || 
        cleanPath.startsWith('lexicon') || 
        cleanPath.startsWith('subject') ||
        cleanPath.startsWith('all') ||
        cleanPath.startsWith('scholar')
      )) {
        const spaUrl = window.location.origin + repoPrefix + 'aaz-index.html#v4/' + cleanPath;
        document.write('<div class="redirect-msg" style="color: #cf7a2f; margin-top: 15px; font-style: italic; font-family: sans-serif; font-size: 14px;">Перенаправление в интерактивный справочник... / Redirecting to interactive version...</div>');
        setTimeout(function() {
          window.location.href = spaUrl;
        }, 1200);
      }
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Страница не найдена / Page Not Found</h2>
    <p>Запрашиваемый ресурс не найден. Возможно, ссылка устарела или страница была перемещена в интерактивный корпус.<br>The requested page was not found. It might have been moved to the interactive corpus.</p>
    <a href="/BookIndex/aaz-index.html" class="btn">На главную справочника / Go to Main Index</a>
  </div>
</body>
</html>
