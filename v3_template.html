  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;

    padding: 8px;
    background: #f7f0e0;

  }
  .legend-dot {

  .phonetic-transition {

  }
  .phonetic-arrow {
    font-weight: 700;
    margin: 0 2px;
  }
  .page-trends-panel {
    overflow-y: scroll;

  }
  .page-trends-shell {
    padding: 16px 22px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .page-trends-head {
    align-items: flex-start;

    flex-wrap: wrap;

    justify-content: space-between;
  }
  .page-trends-title {
    color: #5a3818;

  .page-trends-intro {

    margin-bottom: 12px;
  }
  .page-trends-source-chip {

  .page-trends-actions {

  .page-trends-btn {

  .page-trends-controls {

  }
  .page-trends-range-grid {

  }
  .page-trends-label {
    color: #6a5040;
    font-size: 11px;
  }
  .page-trends-range,
  .page-trends-number {
    margin-top: 4px;

  }
  .page-trends-number {
    border: 1px solid #c4b890;
    border-radius: 4px;
    font-family: inherit;
    padding: 6px 8px;
  }
  .page-trends-quick-row {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 8px;
  }
  .page-trends-select {
    background: #fff;
    border: 1px solid #c4b890;
    border-radius: 4px;

  }
  .page-trends-range-note {
    color: #888;
    font-size: 11px;
  }
  .page-trends-summary-grid {
    display: grid;
    gap: 10px;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));

  }
  .page-trends-summary-card,
  .page-trends-delta-card {
    background: #fff;
    border: 1px solid #d4c8b0;

    padding: 10px 12px;
  }
  .page-trends-summary-title {
    color: #5a3818;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 2px;
  }
  .page-trends-summary-meta {
    color: #666;
    font-size: 11px;
    margin-bottom: 7px;
  }
  .page-trends-summary-subtitle {
    color: #6a5040;
    font-size: 11px;
    margin-bottom: 4px;
  }
  .page-trends-empty-mark {
    color: #999;
    font-size: 12px;
  }
  .page-trends-delta-title {
    color: #5a3818;
    font-size: 13px;

  }
  .page-trends-delta-grid {

    grid-template-columns: repeat(2, minmax(0, 1fr));

  }
  .page-trend-chip {

    display: inline-block;
    font-size: 11px;

    padding: 2px 7px;
    text-decoration: none;
    word-break: break-word;

  }
  .page-trend-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: start;
    gap: 8px;
    width: 100%;
    min-width: 0;
    padding: 4px 0;
    cursor: pointer;
    color: inherit;
    text-decoration: none;
  }
  .page-trend-head {
    min-width: 0;
    color: #5a3818;
    text-decoration: underline dotted;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .page-trend-metrics {
    white-space: nowrap;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .page-trend-metrics.trend-up {

  }
  .page-trend-metrics.trend-down {

  }

  .viz-detail-spaced {

  }
  .viz-map-canvas {

  .viz-map-fallback {

  .tl-grid {

    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));

    align-items: stretch;
    padding-left: 0;

  .tl-grid .tl-item {
    margin: 0;

  }
  .tl-grid .tl-item::before {

  .tl-grid .tl-era {

  .footer-meta {

  .density-select {

    border-radius: var(--control-radius);
    background: var(--surface-soft);
    color: var(--title);
    font-family: inherit;
    font-size: var(--control-font-size);
    padding: var(--control-pad-y) var(--control-pad-x);
    min-height: var(--control-min-h);
  }
  .density-select:hover { background: var(--surface-soft-2); }
  .density-select:focus-visible { outline-offset: 1px; }

  body.density-compact .entity-btn,
  body.density-compact .tab,
  body.density-compact .filter-chip,
  body.density-compact .related-link {
    padding: 4px 9px;

  }

  body.density-compact .header-search input,
  body.density-compact .search-results-scope { padding: 5px 8px; font-size: 11px; }

  body.density-reader .tab,
  body.density-reader .filter-chip,

  }
  body.density-reader .name-item { padding: 7px 12px; font-size: 14px; }
  body.density-reader .name-item .pages-count { font-size: 12px; }

  body.density-reader .card h2 { font-size: 24px; }
  body.density-reader .context-text { font-size: 13px; line-height: 1.65; }
  body.density-reader .header-search input,

  body.density-research .entity-btn,
  body.density-research .tab,
  body.density-research .filter-chip,
  body.density-research .related-link {

  }
  body.density-research .name-item { padding: 5px 10px; font-size: 13px; }
  body.density-research .name-item .pages-count { font-size: 11px; }

  body.density-research .context-text { font-size: 12px; line-height: 1.55; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
    .mobile-card-sheet { transition: none !important; }
  }

  @media (max-width: 900px) {
    .density-select { font-size: 11px; padding: 4px 7px; }
  }

  /* Theme overrides */
  html, body { background: var(--bg); color: var(--text); }
  header { border-bottom-color: var(--line-strong); }
  header h1, .home-link { color: var(--title); }
  .header-search-item .kind, .footer-meta { color: var(--muted); }
  .home-link:hover { border-bottom-color: var(--line-strong); }
  .entity-btn, .tab, .view-tab, .back-btn, .header-search input, .search-results-scope, .filter-chip { border-color: var(--line); }
  .entity-btn, .tab, .view-tab, .back-btn, .search-results-scope, .filter-chip { background: var(--surface-soft); color: var(--title); }
  .entity-btn:hover, .tab:hover, .view-tab:hover, .filter-chip:hover { background: var(--surface-soft-2); }
  .entity-btn.active, .tab.active, .view-tab.active, .filter-chip.active {
    background: var(--title);
    border-color: var(--title);
    color: #fff;
  }
  .content, .mobile-card-sheet { background: var(--panel); }
  .name-list, .card, .header-search-results, .filters input[type="text"], .task-result,
  .command-palette-panel, .command-palette-input {
    background: var(--surface);
    border-color: var(--line);
    color: var(--text);
  }
  .letter-header { background: var(--line-strong); }
  .name-item { border-bottom-color: var(--line-soft); }
  .name-item:hover { background: var(--surface-soft); }
  .name-item.selected { background: var(--surface-soft-2); }
  /* ========= МОБИЛЬНАЯ АДАПТИВНОСТЬ ========= */
  @media (max-width: 900px) {
    body { padding: 8px 10px; }
    header h1 { font-size: 16px; gap: 6px; flex-wrap: wrap; align-items: flex-start; }
    .title-group { gap: 6px; flex: 1 1 100%; flex-wrap: nowrap; white-space: nowrap; overflow: hidden; }
    .title-group .home-link { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .title-group .back-btn { flex: 0 0 auto; }
    .header-search.header-search-inline { flex: 1 1 100%; max-width: 100%; }
    .command-palette-panel { margin-top: 4vh; width: calc(100% - 20px); }
    .command-palette-list { max-height: 60vh; }
    .video-modal-panel { margin-top: 2vh; width: calc(100% - 16px); padding: 10px 12px 14px; }
    .header-tools { flex-direction: column; align-items: stretch; }
    .back-btn { align-self: flex-start; }

    /* Переключатели и вкладки — горизонтальный скролл */
    .entity-switcher, .tabs, .view-tabs {
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      padding-bottom: 4px;
    }
    .entity-switcher::-webkit-scrollbar, .tabs::-webkit-scrollbar, .view-tabs::-webkit-scrollbar { height: 4px; }
    .entity-switcher::-webkit-scrollbar-thumb, .tabs::-webkit-scrollbar-thumb, .view-tabs::-webkit-scrollbar-thumb {
      background: #c4b890; border-radius: 2px;
    }
    .entity-btn { flex-shrink: 0; padding: 6px 10px; font-size: 11px; }
    .entity-btn .count { display: none; }
    .tab { flex-shrink: 0; padding: 6px 10px; font-size: 11px; }
    .view-tab { flex-shrink: 0; padding: 5px 9px; font-size: 11px; }
    .home-stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .home-fact-pair { grid-template-columns: 1fr; }

    /* Список + карточка → одна колонка */
    .list-card-layout {
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .left-pane { max-height: 45vh; }
    .name-list { font-size: 13px; }
    .right-pane { display: none; }
    .mobile-card-sheet { display: block; }

    /* Фильтры компактнее */
    .filters { padding: 6px 8px; }
    .filter-row { gap: 3px; }
    .filter-chip { font-size: 10px; padding: 2px 6px; }
    .filters-top-row { flex-wrap: wrap; gap: 4px; }
    .filters-search { flex: 1 1 100%; }
    .freq-filter-label { width: auto; max-width: 100%; }
    .freq-filter-label input { width: 56px; }
    .page-trends-delta-grid { grid-template-columns: 1fr; }

    /* Карточка */
    .card { padding: 12px; }
    .card h2 { font-size: 18px; }
    .card-photo { width: 70px; height: 90px; }
    .card-two-col-layout { column-count: 1; }
    .card h3 { font-size: 11px; margin: 10px 0 4px; }
    .context-text { font-size: 11px; }
    .card .card-meta-right { align-items: flex-start; }

    /* Гистограмма */
    .bar-row {
      grid-template-columns: 130px 1fr 36px;
      gap: 6px;
    }
    .bar-label { font-size: 10px; }
    .bar-count { font-size: 11px; }
    .chart { padding: 10px; }
    .chart-intro { font-size: 11px; }

    /* Тепловая карта, граф, дерево — горизонтальный скролл */
    .heatmap-container, .graph-container, .timeline-container, .map-container {
      padding: 8px;
    }

    /* Карта */
    .map-iframe-wrap { min-height: 300px; }
    .viz-module-tabs {
      overflow-x: auto;
      flex-wrap: nowrap;
      padding-bottom: 2px;
    }
    .viz-module-btn {
      flex: 0 0 auto;
      white-space: nowrap;
      font-size: 11px;
      padding: 6px 8px;
    }
    .viz-grid { grid-template-columns: 1fr; }
    .viz-map-timeline .viz-toolbar {
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      order: 2;
      margin-top: 8px;
    }
    .viz-map-timeline .viz-toolbar label {
      justify-content: space-between;
    }
    .viz-map-timeline .viz-map-canvas {
      order: 1;
    }

    /* Сетки карточек */
    .cards-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .mini-card { padding: 8px; }
    .mini-card .mc-head { font-size: 13px; }

    .footer-meta { font-size: 9px; }
  }

  @media (max-width: 600px) {
    body { padding: 6px 8px; }
    header h1 { font-size: 14px; }
    .card { padding: 10px; }
    .card h2 { font-size: 16px; }
    .card-header { gap: 8px; }
    .card-photo { width: 56px; height: 72px; }
    .card-two-col-layout { column-count: 1; }
    .entity-btn { padding: 5px 8px; font-size: 10px; }
    .tab { padding: 5px 8px; font-size: 10px; }
    .bar-row { grid-template-columns: 100px 1fr 30px; }
    .bar-label { font-size: 9px; }
    .left-pane { max-height: 40vh; }
    .name-item { padding: 4px 8px; font-size: 12px; }
    .name-item .head { font-size: 12px; }
    .mobile-card-sheet { max-height: 84vh; }
    .mobile-card-sheet-content { max-height: calc(84vh - 40px); }
  }

  /* Premium Citation Widget Styles */
  .citation-widget {
    margin-top: 24px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    font-family: Arial, sans-serif;
  }
  .citation-widget-title {
    font-weight: bold;
    font-size: 14px;
    color: var(--title);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .citation-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
  }
  .citation-tab-btn {
    background: none;
    border: none;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    border-radius: 4px;
    font-weight: 600;
    transition: all 0.2s ease;
  }
  .citation-tab-btn:hover {
    background: var(--surface-soft-2);
    color: var(--title);
  }
  .citation-tab-btn.active {
    background: var(--primary);
    color: var(--surface);
  }
  .citation-box-container {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .citation-box {
    padding: 12px 14px;
    border: 1px dashed var(--line-strong);
    border-radius: 4px;
    background: var(--surface);
    font-size: 13px;
    line-height: 1.45;
    color: var(--text);
    word-break: break-word;
    font-family: 'Noto Serif', Georgia, serif;
    min-height: 52px;
  }
  .citation-copy-btn {
    align-self: flex-end;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    color: var(--title);
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 700;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .citation-copy-btn:hover {
    background: var(--primary);
    color: var(--surface);
  }
</style>
</head>
